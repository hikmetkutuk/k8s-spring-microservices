server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: task-service
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:20s}
  task:
    scheduling:
      shutdown:
        # OutboxRelay @Scheduled ile çalışıyor. Bu ayar olmadan pod kapanırken
        # devam eden bir relay turu yarıda kesilir; batch'teki event'ler Kafka'ya
        # gitmiş ama outbox'ta "published" işaretlenmemiş olabilir (bir sonraki
        # açılışta tekrar yayınlanır — notification-service idempotent olduğu için
        # veri bozulmaz, yine de gereksiz duplicate üretir).
        await-termination: true
        await-termination-period: ${SCHEDULER_AWAIT_TERMINATION:15s}
  # Spring Cloud 2025.0.0'ın discovery autoconfiguration'ı (OpenFeign'in getirdiği
  # spring-cloud-commons transitive'i), Boot 4.1.0'da taşınmış eski
  # `org.springframework.boot.autoconfigure.web.ServerProperties` paketine reflection ile
  # eriştiği için NoClassDefFoundError atıyor. Statik URL ile Feign kullandığımız için
  # (service discovery yok) zaten ihtiyaç duyulmuyor; spring-cloud-commons'ın kendisi
  # FeignAutoConfiguration'ın derleme zamanı bağımlılığı olduğu için modül dışlanamıyor,
  # sadece bu tek autoconfiguration class'ı dışlanıyor.
  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:task_service}
    username: ${DB_USERNAME:task_service}
    password: ${DB_PASSWORD:task_service}
    # Havuz boyutlandırma gerekçesi için bkz. auth-service/application.yml —
    # 5 servis aynı PostgreSQL instance'ını paylaşıyor. Bu serviste HTTP isteklerine
    # ek olarak outbox relay de havuzdan bağlantı aldığı için minimum-idle 1 fazla.
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:300000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
  batch-size: ${OUTBOX_BATCH_SIZE:20}
  retry-delay-seconds: ${OUTBOX_RETRY_DELAY_SECONDS:30}

jwt:
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public_key.pem}

catalog-service:
  url: ${CATALOG_SERVICE_URL:http://localhost:8083}

feign:
  client:
    config:
      catalog-service:
        connect-timeout: 2000
        read-timeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      catalogService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - feign.FeignException$NotFound
  retry:
    instances:
      catalogService:
        max-attempts: 3
        wait-duration: 500ms
        ignore-exceptions:
          - feign.FeignException$NotFound

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
