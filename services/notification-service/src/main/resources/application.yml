server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: notification-service
  lifecycle:
    # Bu serviste iki ayrı kapanma fazı var: Kafka listener container'ı ve web server.
    # Listener container SmartLifecycle olduğu için context kapanırken durdurulur;
    # varsayılan davranış (immediate-stop=false) işlenmekte olan batch'i tamamlayıp
    # offset'i commit etmesini sağlar. terminationGracePeriodSeconds bu iki fazın
    # toplamını karşılayacak şekilde ayarlandı (bkz. values.yaml → gracefulShutdown).
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:20s}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_service}
    username: ${DB_USERNAME:notification_service}
    password: ${DB_PASSWORD:notification_service}
    # Havuz boyutlandırma gerekçesi için bkz. auth-service/application.yml —
    # 5 servis aynı PostgreSQL instance'ını paylaşıyor.
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:300000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.k8sspringmicroservices.common.event
        spring.json.value.default.type: com.k8sspringmicroservices.common.event.TaskCreatedEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

jwt:
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public_key.pem}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
