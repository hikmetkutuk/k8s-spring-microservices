server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  # libs:common'daki servlet/MVC tabanlı auto-configuration'lar (GlobalExceptionHandler,
  # JwtAuthenticationFilter) reactive gateway ile uyumsuz olduğundan devre dışı bırakılır;
  # JWT doğrulaması bu servis için filter.JwtAuthenticationGatewayFilter ile yapılır.
  autoconfigure:
    exclude:
      - com.k8sspringmicroservices.common.autoconfigure.CommonExceptionHandlingAutoConfiguration
      - com.k8sspringmicroservices.common.security.jwt.JwtSecurityAutoConfiguration
      # Spring Cloud 2025.0.0'ın discovery/load-balancer autoconfiguration'ları Boot 4.1.0'da
      # taşınmış eski paketlere (org.springframework.boot.autoconfigure.web.ServerProperties,
      # org.springframework.boot.web.context.WebServerInitializedEvent vb.) reflection ile
      # eriştiği için NoClassDefFoundError atıyor. Statik route URL'leri kullandığımız için
      # (service discovery/load balancer yok) zaten ihtiyaç duyulmuyor.
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.discovery.simple.reactive.SimpleReactiveDiscoveryClientAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # Tarayıcıdan gelen istekler için CORS — bu servis tek edge olduğundan
          # CORS'un doğru tanımlanacağı tek yer burası (backend'ler doğrudan browser'dan
          # çağrılmaz). Üretimde CORS_ALLOWED_ORIGINS ile gerçek frontend origin'i set edilmeli;
          # varsayılan sadece local dev'i (React/Vite tipik portları) hedefler.
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: [Authorization, Content-Type]
                allowCredentials: true
                maxAge: 3600
          filter:
            # Response security header'ları: HSTS, CSP, X-Frame-Options, X-Content-Type-Options
            # vb. Spring Cloud Gateway'in yerleşik SecureHeaders filter'ı ile tek yerden
            # (edge'de) eklenir — backend'lerin ayrıca kendi header'larını yazması bu yüzden
            # zorunlu değil ama defense-in-depth için SecurityConfig'lerinde de tanımlı.
            secure-headers:
              content-security-policy: "default-src 'self'"
          default-filters:
            - SecureHeaders
            # Hijyen: istemciden gelen Forwarded/X-Forwarded-* header'larını girişte siliyoruz.
            # OpenAPI "servers" adresi artık header'lardan değil, her servisin
            # ServerBaseUrlCustomizer'ında sabit/konfigüre edilen değerden geliyor (bkz.
            # OpenApiConfig.java) — bu yüzden backend'lerde forward-headers-strategy da
            # devre dışı, hiçbir servis client-supplied forwarded header'a güvenmiyor.
            - RemoveRequestHeader=Forwarded
            - RemoveRequestHeader=X-Forwarded-For
            - RemoveRequestHeader=X-Forwarded-Host
            - RemoveRequestHeader=X-Forwarded-Port
            - RemoveRequestHeader=X-Forwarded-Proto
            - RemoveRequestHeader=X-Forwarded-Prefix
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/users/**
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/catalog-items/**
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/tasks/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/notifications/**
            # Swagger UI aggregation: her servisin kendi /v3/api-docs'unu ayrı bir path
            # prefix'i altında proxy'liyoruz (servisler /auth/** gibi kendi path'lerinde
            # zaten route edildiği için api-docs için ayrı bir prefix + RewritePath gerekiyor).
            - id: auth-service-docs
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth-docs/**
              filters:
                - RewritePath=/auth-docs/(?<segment>.*), /$\{segment}
            - id: user-service-docs
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/user-docs/**
              filters:
                - RewritePath=/user-docs/(?<segment>.*), /$\{segment}
            - id: catalog-service-docs
              uri: ${CATALOG_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/catalog-docs/**
              filters:
                - RewritePath=/catalog-docs/(?<segment>.*), /$\{segment}
            - id: task-service-docs
              uri: ${TASK_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/task-docs/**
              filters:
                - RewritePath=/task-docs/(?<segment>.*), /$\{segment}
            - id: notification-service-docs
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/notification-docs/**
              filters:
                - RewritePath=/notification-docs/(?<segment>.*), /$\{segment}

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /auth-docs/v3/api-docs
      - name: user-service
        url: /user-docs/v3/api-docs
      - name: catalog-service
        url: /catalog-docs/v3/api-docs
      - name: task-service
        url: /task-docs/v3/api-docs
      - name: notification-service
        url: /notification-docs/v3/api-docs

jwt:
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public_key.pem}

gateway:
  security:
    public-paths:
      - /auth/register
      - /auth/login
      - /auth/refresh
      - /actuator/health
      - /actuator/prometheus
      - /auth-docs
      - /user-docs
      - /catalog-docs
      - /task-docs
      - /notification-docs
      - /swagger-ui
      - /v3/api-docs

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
