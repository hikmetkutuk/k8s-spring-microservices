group=com.k8sspringmicroservices
version=0.1.0-SNAPSHOT

springBootVersion=4.1.0
springDependencyManagementVersion=1.1.7
springCloudVersion=2025.0.0
resilience4jVersion=2.3.0
javaVersion=25

# Jib: base image digest ile sabitlenmiş (multi-arch manifest list), "latest" kullanılmıyor.
# Rotasyon gerektiğinde digest'i güncelleyin: docker manifest inspect eclipse-temurin:25-jre-alpine
jibBaseImage=eclipse-temurin:25-jre-alpine@sha256:28db6fdf60e38945e43d840c0333aeaec66c15943070104f7586fd3c9d1665b0
# Local geliştirmede varsayılan hedef registry; CI'da -PimageRegistry=... ile override edilir (bkz. madde 16).
# Not: 5000 değil 5001 kullanılıyor çünkü macOS'ta AirPlay Receiver 5000 portunu dinliyor
# (bkz. infra/kind/create-cluster.sh).
imageRegistry=localhost:5001
# Local Kind registry düz HTTP olduğu için true; CI/production'da -PjibAllowInsecureRegistries=false ile kapatın.
jibAllowInsecureRegistries=true

# google-java-format (Spotless), javac internal API'lerine reflection ile eriştiği için JDK 17+'ta gerekli
org.gradle.jvmargs=--add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-opens jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
