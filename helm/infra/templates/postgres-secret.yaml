{{- $secrets := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword gereklidir (--set secrets.postgresPassword=...)" $secrets.postgresPassword | quote }}
  {{- range .Values.postgres.databases }}
  {{ .user | upper }}_DB_PASSWORD: {{ required (printf "secrets.dbPasswords.%s gereklidir" .name) (index $secrets.dbPasswords .name) | quote }}
  {{- end }}
