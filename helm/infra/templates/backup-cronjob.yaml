{{- if .Values.postgres.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: backups
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: backups
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          containers:
            - name: backup
              image: {{ $.Values.postgres.image | quote }}
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: POSTGRES_PASSWORD
                - name: RETENTION_DAYS
                  value: {{ .Values.postgres.backup.retentionDays | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  set -o pipefail
                  BACKUP_FILE="/backups/backup-$(date -u +%Y%m%d-%H%M%S).sql.gz"
                  echo "pg_dumpall başlatılıyor..."
                  pg_dumpall -h postgres -U postgres | gzip > "$BACKUP_FILE"
                  echo "Backup oluşturuldu: $BACKUP_FILE ($(ls -lh "$BACKUP_FILE" | awk '{print $5}'))"
                  # Retention: RETENTION_DAYS günden eski backup'ları sil
                  find /backups -name "backup-*.sql.gz" -mtime "+${RETENTION_DAYS}" -delete -exec echo "Eski backup silindi: {}" \;
                  echo "Mevcut backup'lar:"
                  ls -lh /backups/
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
{{- end }}
