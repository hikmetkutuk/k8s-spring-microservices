apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  labels:
    app.kubernetes.io/name: postgres
data:
  init-databases.sh: |
    #!/bin/bash
    # Postgres container ilk açılışta (veri dizini boşken) /docker-entrypoint-initdb.d
    # altındaki script'leri otomatik çalıştırır. Parolalar burada YOK — sadece container'ın
    # ortam değişkeni olarak enjekte edilen (Secret kaynaklı) *_DB_PASSWORD adlarını okur.
    set -e

    create_db_and_user() {
      local db="$1"
      local user="$2"
      local password_var="$3"
      local password="${!password_var}"

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
        -v role_name="$user" -v role_password="$password" -v db_name="$db" <<-'SQL'
          SELECT 'CREATE ROLE "' || :'role_name' || '" LOGIN PASSWORD ' || quote_literal(:'role_password')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role_name')\gexec

          SELECT 'CREATE DATABASE "' || :'db_name' || '" OWNER "' || :'role_name' || '"'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db_name')\gexec
    SQL
    }

    {{- range .Values.postgres.databases }}
    create_db_and_user "{{ .name }}" "{{ .user }}" "{{ .user | upper }}_DB_PASSWORD"
    {{- end }}
