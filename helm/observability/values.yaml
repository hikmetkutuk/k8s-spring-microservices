prometheus:
  fullnameOverride: prometheus
  alertmanager:
    enabled: false
  serverFiles:
    alerts:
      groups:
        - name: microservices
          rules:
            - alert: TaskOutboxBacklog
              expr: max by (namespace, application) (task_outbox_pending{application="task-service"}) > 100
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: Task outbox has more than 100 pending events
            - alert: TaskOutboxOldestEvent
              expr: max by (namespace, application) (task_outbox_oldest_age_seconds{application="task-service"}) > 300
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: Task outbox delivery is delayed by more than five minutes
            - alert: TaskOutboxPublishFailures
              expr: sum by (namespace, application) (increase(task_outbox_publish_failures_total{application="task-service"}[5m])) > 0
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: Task outbox Kafka publication attempts are failing
            - alert: MicroserviceUnavailable
              expr: max by (namespace, deployment) (kube_deployment_status_replicas_available{deployment=~"api-gateway|auth-service|user-service|catalog-service|task-service|notification-service"}) == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: Microservice has no available replicas
            - alert: MicroserviceScrapeFailed
              expr: max by (namespace, app_kubernetes_io_name) (up{job="kubernetes-pods",app_kubernetes_io_name=~"api-gateway|auth-service|user-service|catalog-service|task-service|notification-service"}) == 0
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: Prometheus cannot scrape any replica of a microservice
            - alert: MicroserviceHighErrorRate
              expr: |
                (sum by (namespace, application) (rate(http_server_requests_seconds_count{application=~"api-gateway|auth-service|user-service|catalog-service|task-service|notification-service",status=~"5..",uri!~"/actuator.*"}[5m]))
                / sum by (namespace, application) (rate(http_server_requests_seconds_count{application=~"api-gateway|auth-service|user-service|catalog-service|task-service|notification-service",uri!~"/actuator.*"}[5m])) > 0.05)
                and on (namespace, application)
                (sum by (namespace, application) (increase(http_server_requests_seconds_count{application=~"api-gateway|auth-service|user-service|catalog-service|task-service|notification-service",uri!~"/actuator.*"}[5m])) >= 20)
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: More than five percent of HTTP requests fail with 5xx
            - alert: MicroserviceHighLatency
              expr: |
                (histogram_quantile(0.99, sum by (namespace, application, le) (rate(http_server_requests_seconds_bucket{application=~"api-gateway|auth-service|user-service|catalog-service|task-service|notification-service",uri!~"/actuator.*"}[5m]))) > 2)
                and on (namespace, application)
                (sum by (namespace, application) (increase(http_server_requests_seconds_count{application=~"api-gateway|auth-service|user-service|catalog-service|task-service|notification-service",uri!~"/actuator.*"}[5m])) >= 20)
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: HTTP p99 latency exceeds two seconds
  server:
    fullnameOverride: prometheus-server
    persistentVolume:
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  # Not: chart'ın kendi varsayılan scrapeConfigs'inde zaten `prometheus.io/scrape` pod
  # annotation'larını okuyan bir "kubernetes-pods" job'ı var — bizim servislerimizin
  # `common.podAnnotations` helper'ıyla eklediği annotation'lar bu job tarafından otomatik
  # keşfediliyor, ekstra scrape config gerekmiyor.

grafana:
  fullnameOverride: grafana
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-server
          isDefault: true
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3200

tempo:
  fullnameOverride: tempo
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki-stack:
  loki:
    fullnameOverride: loki
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  promtail:
    fullnameOverride: promtail
    # loki-stack'in varsayılanı push URL'ini {{ .Release.Name }}:3100 olarak kurar; bizim
    # release adımız "loki" olmadığı için (fullnameOverride: loki) bunu explicit vermek gerekiyor.
    config:
      clients:
        - url: http://loki:3100/loki/api/v1/push
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# Grafana admin parolası. Varsayılan YOK — kurulumda --set/--set-file ile
# ya da gitignore'lu bir values dosyasıyla sağlanmalı (bkz. helm/README.md).
secrets: {}
