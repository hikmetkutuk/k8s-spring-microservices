apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-user: admin
  admin-password: {{ required "secrets.grafanaAdminPassword gereklidir (--set secrets.grafanaAdminPassword=...)" .Values.secrets.grafanaAdminPassword | quote }}
