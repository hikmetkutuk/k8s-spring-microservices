replicaCount: 1

image:
  repository: localhost:5001/api-gateway
  tag: "0.1.0-SNAPSHOT"
  # SNAPSHOT tag'i mutable (aynı tag farklı build'lerde farklı içerik taşıyabilir) —
  # IfNotPresent kullanılırsa node yeni push'u fark etmez, eski cache'lenmiş image çalışır.
  # Immutable/digest-pinned tag'lere geçilince (CI/CD, madde 16) IfNotPresent'e dönülebilir.
  pullPolicy: Always

# Cluster dışına açılış (Ingress/LoadBalancer) madde 13'te (local K8s kurulumu) netleştirilecek;
# şimdilik ClusterIP + port-forward ile erişilebilir.
service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  # OTel SDK, Spring'in management.otlp.tracing.endpoint property'sini değil doğrudan bu
  # standart env var'ları okuyor (bu Boot 4.1.0 sürümünde property binding çalışmıyor).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAME: api-gateway
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_PUBLIC_KEY_LOCATION: file:/etc/jwt/public_key.pem
  AUTH_SERVICE_URL: http://auth-service:8081
  USER_SERVICE_URL: http://user-service:8082
  CATALOG_SERVICE_URL: http://catalog-service:8083
  TASK_SERVICE_URL: http://task-service:8084
  NOTIFICATION_SERVICE_URL: http://notification-service:8085

jwt:
  publicKeySecretName: jwt-keys

podDisruptionBudget:
  enabled: false
  minAvailable: 1
