replicaCount: 1

image:
  repository: localhost:5001/catalog-service
  tag: "0.1.0-SNAPSHOT"
  # SNAPSHOT tag'i mutable (aynı tag farklı build'lerde farklı içerik taşıyabilir) —
  # IfNotPresent kullanılırsa node yeni push'u fark etmez, eski cache'lenmiş image çalışır.
  # Immutable/digest-pinned tag'lere geçilince (CI/CD, madde 16) IfNotPresent'e dönülebilir.
  pullPolicy: Always

service:
  port: 8083

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ConfigMap'e yazılacak, hassas olmayan config. Host değerleri local Kind cluster
# varsayımıyla doldurulmuştur; madde 13'te kurulacak Postgres/Redis Helm release
# adlarına göre `--set config.dbHost=...` ile override edilecek.
config:
  # OTel SDK, Spring'in management.otlp.tracing.endpoint property'sini değil doğrudan bu
  # standart env var'ları okuyor (bu Boot 4.1.0 sürümünde property binding çalışmıyor).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAME: catalog-service
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: catalog_service
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_PUBLIC_KEY_LOCATION: file:/etc/jwt/public_key.pem
  # Swagger UI, gateway aggregation'ı ile bu prefix altında proxy'leniyor.
  # springdoc'un OpenAPI "servers" adresini istemciden gelen (sahte olabilecek)
  # Forwarded/X-Forwarded-* header'larından değil, bu sabit değerden üretmesini
  # sağlar (bkz. OpenApiConfig.java ServerBaseUrlCustomizer). Local Kind port-forward'a
  # özgü; farklı ortamda gateway'in gerçek dışa açık adresiyle override edilmeli.
  SPRINGDOC_SERVER_BASE_URL: http://localhost:18080/catalog-docs

# Secret'a yazılacak hassas değerler. Varsayılan YOK — kurulumda
# `--set secrets.dbUsername=... --set secrets.dbPassword=...` ile veya gitignore'lu
# bir values dosyasıyla sağlanmalı (bkz. helm/README.md).
secrets: {}

jwt:
  publicKeySecretName: jwt-keys

podDisruptionBudget:
  enabled: false
  minAvailable: 1
